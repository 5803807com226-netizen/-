      label: ↳ English · ชื่อไทย
      description: ภาษาอังกฤษ ไม่ใส่ก็ได้ ถ้าว่างหน้าเว็บภาษาอังกฤษจะใช้ข้อความภาษาไทยแทน
    - name: text
