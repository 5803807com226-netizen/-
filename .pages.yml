      collapsible:
        collapsed: true
        summary: '{index}. {title}'
    fields:
    - name: title
      label: ขั้นตอน
      type: string
    - type: string
      name: title_en
      label: ↳ English · ขั้นตอน
      description: ภาษาอังกฤษ ไม่ใส่ก็ได้ ถ้าว่างหน้าเว็บภาษาอังกฤษจะใช้ข้อความภาษาไทยแทน
    - name: text
