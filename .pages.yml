    description: ภาษาอังกฤษ ไม่ใส่ก็ได้ ถ้าว่างหน้าเว็บภาษาอังกฤษจะใช้ข้อความภาษาไทยแทน
  - name: services
    label: บริการ
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{th}'
    fields:
    - name: en
      label: ชื่ออังกฤษ (ตัวเอียงสีส้ม)
      type: string
